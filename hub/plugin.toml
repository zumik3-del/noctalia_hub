id = "zumik3-del/hub"
name = "Hub"
version = "0.1.0"
plugin_api = 32
author = "zumik3-del"
license = "MIT"
icon = "gauge"
tags = ["bar", "panel", "service", "indicator", "utility", "system"]
description = "Full-screen instrument panel: service status, metrics, releases and links from one YAML file."
dependencies = ["yq"]

# Skeleton build: config.luau loads and validates hub.yaml, service.luau publishes
# cards into noctalia.state, panel.luau and widget.luau only read that state.
# See docs/05-architecture.md.

[[widget]]
id = "summary"
entry = "widget.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "gauge"

  [[widget.setting]]
  key = "compact"
  type = "bool"
  label_key = "settings.compact.label"
  description_key = "settings.compact.description"
  default = false

# `persistent = true` is deliberately absent: Noctalia rejects it together with
# keyboard_focus = "exclusive", and the keyboard-first panel needs the focus.
# See docs/07-decisions.md (D1).
#
# capture_keys lists only what the panel answers today. Capturing a key it cannot
# honour takes that key away from every other surface, so "/" and "?" are added
# when the search and the shortcut overlay exist.
[[panel]]
id = "panel"
entry = "panel.luau"
# Pixels, not a fraction: the manifest accepts a number or "fill", and nothing
# between. 960x1080 is the left half of the 1920x1080 panel this was written on, so
# a different monitor means editing these two numbers. There is no way to ask for
# "half the screen" and have it follow the display.
width = 960
height = 1080
placement = "floating"
position = "center_left"
dismiss_on_outside_click = false
keyboard_focus = "exclusive"
capture_keys = ["escape", "r"]

[[service]]
id = "collector"
entry = "service.luau"
