# noctalia_hub — skeleton config
#
# Copy to ~/.config/noctalia/hub/hub.yaml:
#
#   cp config/hub.skeleton.yaml ~/.config/noctalia/hub/hub.yaml
#
# Most cards here use `source: { type: static }`, which renders exactly as
# written — the fastest way to see the panel's shape without touching anything.
# `command` fetches now too, so the Pi-hole card below is a real reading: it
# asks the host over HTTPS, and it carries the two trailing buttons, one to the
# admin UI and one into the container.
#
# http / stream / rss are still recognised but not built: a card that uses one
# says "not implemented in this build" rather than showing nothing, which is the
# panel being honest rather than empty. config/hub.example.yaml is the full
# thing, with worked examples of every field.
#
# Field reference: docs/03-config.md

version: 1

layout:
  density: compact          # compact | standard | comfortable
  show_header: true
  clock: "%H:%M:%S"
  stale_badge: true
  # Card-block framework (see docs/07-decisions.md, D24). Every field is optional;
  # these are the defaults. Colour is never set here — only density and shape.
  font_scale: 100           # 80..130, % applied to every text size
  card_radius: 9            # 0..24 px, corner rounding of a card block
  card_spacing: 8           # 0..32 px, gap between cards in a zone
  card_border: subtle       # none | subtle | accent
  card_background: tinted   # transparent | tinted | solid
  hover_effect: background  # none | background | border

defaults:
  interval_sec: 60
  timeout_ms: 8000
  stale_after_sec: 300
  graph_points: 48


domains:

  # ── Instruments ────────────────────────────────────────────────────────────
  # The panel's reason to exist: what is this thing, is it alive, and is the
  # number it reports one you have to look at.
  - id: services
    title: Services
    glyph: server
    interval_sec: 60

    cards:
      - id: gateway
        title: Gateway
        glyph: router
        kind: status
        description: Keenetic, gateway and routing
        source: { type: static, value: running }

      - id: storage
        title: Storage
        glyph: database
        kind: status
        source: { type: static, value: running }

      # `map` answers "what does this value mean" — see docs/03-config.md. A value
      # the map does not list is `down` with the reason attached, never a guess.
      - id: dns
        title: DNS
        glyph: world
        kind: status
        source: { type: static, value: degraded }
        map:
          running: ok
          degraded: warn
          stopped: down

      # The first card that is not static: it asks the service over HTTPS, so the
      # dot is a real reading. No login is attempted and the redirect to Authelia
      # counts as reachable — the question is "is the host answering", not "can we
      # get in". `-k` because a LAN service may present a self-signed certificate,
      # and a certificate warning is not the question either.
      #
      # `link` and `run` are the two trailing buttons — one opens the admin UI in
      # the browser, the other drops into the container. `-t` gives the container
      # the TTY `pct enter` needs; without it the shell opens and does nothing.
      # The hop is `ssh` plus `pct exec` in one `run` string, shell-verbatim (D17).
      - id: pihole
        title: Pi-hole
        glyph: shield-check
        kind: status
        description: DNS filtering and ad blocking
        link: https://dns.home.lan/admin/
        run: "ssh -t proxmox 'pct enter 100'"
        source:
          type: command
          argv: ["curl", "-k", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://dns.home.lan/admin/"]
        format: "online"

      # `format` and `unit` are the value column. `{n}` is the extracted value.
      - id: nodes
        title: Nodes
        glyph: hexagon
        kind: metric
        span: 2
        source: { type: static, value: 3 }
        format: "{n} nodes"
        thresholds: { warn: 6, critical: 8 }
        graph: true

      # A metric without thresholds is a config error (D10): a green 38% says
      # nothing about whether 38% is nominal.
      - id: backup-age
        title: Backup age
        glyph: archive
        kind: metric
        source: { type: static, value: 7 }
        format: "{n}"
        unit: "h"
        thresholds: { warn: 24, critical: 72 }

      # kind: list collapses to a count. Expansion on Enter lands with step 8;
      # a static list is here so the count is visible before then.
      - id: routes
        title: routes
        glyph: route
        kind: list
        max_items: 6
        format: "{n} sites"
        source:
          type: static
          value:
            - dynacat.home.lan
            - grafana.home.lan
            - ops.home.lan


  # ── Releases ───────────────────────────────────────────────────────────────
  # The domain-level interval is the whole of release polling. A kind does not get
  # its own timer — a kind decides how a reading is drawn, not how often it is
  # fetched (D4).
  - id: releases
    title: Releases
    glyph: tag
    interval_sec: 3600

    cards:
      - id: shell
        title: Noctalia
        kind: release
        source: { type: static, value: "5.2.1" }

      - id: terminal
        title: Kitty
        kind: release
        source: { type: static, value: "0.36" }


  # ── Links ──────────────────────────────────────────────────────────────────
  # kind: link needs no source to be a reading — it needs a place to go, and
  # actions land with step 6.
  - id: links
    title: Links
    glyph: link

    cards:
      - id: link-metrics
        title: Metrics
        glyph: chart-line
        kind: link
        source: { type: static, value: "—" }

      - id: link-uptime
        title: Uptime
        glyph: activity
        kind: link
        source: { type: static, value: "—" }

      # `hidden: true` keeps a card in the config without rendering it. It does
      # not stop its source: hiding a card is not a way to un-watch a service.
      - id: link-scratch
        title: Scratch
        kind: link
        hidden: true
        source: { type: static, value: "—" }

# Secrets are not needed here. When you move to config/hub.example.yaml, put them
# in hub.secrets.yaml (mode 0600) and reference them as "${name}" — quoted inside
# a flow mapping, or YAML reads the brace as a nested mapping. See docs/03-config.md.
