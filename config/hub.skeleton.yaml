# noctalia_hub — skeleton config
#
# Copy to ~/.config/noctalia/hub/hub.yaml:
#
#   cp config/hub.skeleton.yaml ~/.config/noctalia/hub/hub.yaml
#
# Most cards here use `source: { type: static }`, which renders exactly as
# written — the fastest way to see the panel's shape without touching anything.
# `command` fetches now too, so the Pi-hole card below is a real reading: it
# asks the host over HTTPS, shows its pending OS updates as a button, and carries
# the two trailing buttons, one to the admin UI and one into the container.
#
# http / stream / rss are still recognised but not built: a card that uses one
# says "not implemented in this build" rather than showing nothing, which is the
# panel being honest rather than empty. config/hub.example.yaml is the full
# thing, with worked examples of every field.
#
# Field reference: docs/03-config.md

version: 1

layout:
  density: compact          # compact | standard | comfortable
  show_header: true
  clock: "%H:%M:%S"
  stale_badge: true
  # Card-block framework (see docs/07-decisions.md, D24). Every field is optional;
  # these are the defaults. Colour is never set here — only density and shape.
  font_scale: 100           # 80..130, % applied to every text size
  card_radius: 9            # 0..24 px, corner rounding of a card block
  card_spacing: 8           # 0..32 px, gap between cards in a zone
  card_border: subtle       # none | subtle | accent
  card_background: tinted   # transparent | tinted | solid
  hover_effect: background  # none | background | border

defaults:
  interval_sec: 60
  timeout_ms: 8000
  stale_after_sec: 300
  graph_points: 48


domains:

  # ── Services ───────────────────────────────────────────────────────────────
  # What is this thing, is it alive, and can I get into it. Each real service is
  # a reachability dot with a link and a terminal — except the router, which has
  # no useful state to poll and no shell to enter, so it is a bookmark.
  - id: services
    title: Services
    glyph: server
    interval_sec: 60

    cards:
      - id: gateway
        title: Gateway
        glyph: router
        kind: link
        description: Keenetic, gateway and routing
        link: http://192.168.1.1/

      # The host itself, not a service in a container: the probe is the web UI at
      # the URL a browser uses, and the terminal is a plain ssh into the node. No
      # `pct exec` here — there is no container between this panel and Proxmox VE.
      # The probe follows the same self-signed-certificate reasoning as Pi-hole
      # below (`-k`), and any HTTP answer is a live host.
      #
      # `updates` shows the node's own pending packages — the same second reading,
      # one hop shorter: `ssh proxmox` then `sh -c`, with no `pct` in between.
      # Upgrades here land on the hypervisor, not in a container, which is why the
      # count is a button into a terminal rather than something run out of sight.
      - id: proxmox
        title: Proxmox
        glyph: server-cog
        kind: status
        description: Proxmox VE web interface
        link: https://proxmox.home.lan/
        run: "ssh proxmox"
        source:
          type: command
          argv: ["curl", "-k", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://proxmox.home.lan/"]
        updates:
          interval_sec: 3600
          source:
            type: command
            argv: ["ssh", "proxmox", "sh -c 'apt-get update -qq >/dev/null || exit 1; apt-get -s -q upgrade | grep -c ^Inst || true'"]
          run: "ssh -t proxmox 'apt-get update && apt-get -y upgrade'"

      # Two more container services: the same probe-plus-terminal shape as
      # Pi-hole, one `pct enter` per LXC (103 Pulse, 118 Duplicati), plus the
      # same Debian update badge — both containers run Debian, so the check is
      # `pct exec ... sh -c`, written out rather than guessed (D17, D28).
      - id: pulse
        title: Pulse
        glyph: heart-rate-monitor
        kind: status
        description: LXC & VM monitoring for Proxmox
        link: https://pulse.home.lan/
        run: "ssh -t proxmox 'pct enter 103'"
        source:
          type: command
          argv: ["curl", "-k", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://pulse.home.lan/"]
        updates:
          interval_sec: 3600
          source:
            type: command
            argv: ["ssh", "proxmox", "pct exec 103 -- sh -c 'apt-get update -qq >/dev/null || exit 1; apt-get -s -q upgrade | grep -c ^Inst || true'"]
          run: "ssh -t proxmox 'pct exec 103 -- sh -c \"apt-get update && apt-get -y upgrade\"'"

      - id: duplicati
        title: Duplicati
        glyph: cloud-upload
        kind: status
        description: Backup
        link: https://backup.home.lan/
        run: "ssh -t proxmox 'pct enter 118'"
        source:
          type: command
          argv: ["curl", "-k", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://backup.home.lan/"]
        updates:
          interval_sec: 3600
          source:
            type: command
            argv: ["ssh", "proxmox", "pct exec 118 -- sh -c 'apt-get update -qq >/dev/null || exit 1; apt-get -s -q upgrade | grep -c ^Inst || true'"]
          run: "ssh -t proxmox 'pct exec 118 -- sh -c \"apt-get update && apt-get -y upgrade\"'"

      # The first card that is not static: it asks the service over HTTPS, so the
      # dot is a real reading. No login is attempted and the redirect to Authelia
      # counts as reachable — the question is "is the host answering", not "can we
      # get in". `-k` because a LAN service may present a self-signed certificate,
      # and a certificate warning is not the question either.
      #
      # A `kind: status` card draws only the dot, so there is no `format:` here to
      # write "online" into (D27).
      #
      # `link` and `run` are the two trailing buttons — one opens the admin UI in
      # the browser, the other drops into the container. `-t` gives the container
      # the TTY `pct enter` needs; without it the shell opens and does nothing.
      # The hop is `ssh` plus `pct exec` in one `run` string, shell-verbatim (D17).
      #
      # `updates` is the second reading, drawn as a badge before the dot: how many
      # OS packages the container has pending. It speaks only when there is
      # something to say — nothing pending is nothing on screen — and the count is
      # the button that installs them. The check is Debian's, written out because
      # the plugin does not guess apt from apk (D17, D27): `sh -c`, not `sh -lc`,
      # or the container's MOTD lands in the output; `|| true` so a zero count is
      # not read as a command failure; `apt-get update` first so the count is
      # about now rather than about whenever the package lists last moved.
      - id: pihole
        title: Pi-hole
        glyph: shield-check
        kind: status
        description: DNS filtering and ad blocking
        link: https://dns.home.lan/admin/
        run: "ssh -t proxmox 'pct enter 100'"
        source:
          type: command
          argv: ["curl", "-k", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://dns.home.lan/admin/"]
        updates:
          # Every 3600s by default; a package check is not asked on the card's 60s.
          interval_sec: 3600
          source:
            type: command
            argv: ["ssh", "proxmox", "pct exec 100 -- sh -c 'apt-get update -qq >/dev/null || exit 1; apt-get -s -q upgrade | grep -c ^Inst || true'"]
          run: "ssh -t proxmox 'pct exec 100 -- sh -c \"apt-get update && apt-get -y upgrade\"'"

      # The rest of the stack, taken from the dynacat dashboard's monitor groups.
      # Every card is the same shape: an HTTPS probe, the admin link, a `pct
      # enter` terminal into its LXC, and the Debian/Ubuntu update badge — except
      # where there is no LXC of its own (a note on each).

      - id: jellyfin
        title: Jellyfin
        glyph: device-tv
        kind: status
        description: Media library and streaming
        link: https://jellyfin.home.lan/
        run: "ssh -t proxmox 'pct enter 107'"
        source:
          type: command
          argv: ["curl", "-k", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://jellyfin.home.lan/"]
        updates:
          interval_sec: 3600
          source:
            type: command
            argv: ["ssh", "proxmox", "pct exec 107 -- sh -c 'apt-get update -qq >/dev/null || exit 1; apt-get -s -q upgrade | grep -c ^Inst || true'"]
          run: "ssh -t proxmox 'pct exec 107 -- sh -c \"apt-get update && apt-get -y upgrade\"'"

      - id: vaultwarden
        title: Vaultwarden
        glyph: lock
        kind: status
        description: Password manager
        link: https://vault.home.lan/
        run: "ssh -t proxmox 'pct enter 102'"
        source:
          type: command
          argv: ["curl", "-k", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://vault.home.lan/"]
        updates:
          interval_sec: 3600
          source:
            type: command
            argv: ["ssh", "proxmox", "pct exec 102 -- sh -c 'apt-get update -qq >/dev/null || exit 1; apt-get -s -q upgrade | grep -c ^Inst || true'"]
          run: "ssh -t proxmox 'pct exec 102 -- sh -c \"apt-get update && apt-get -y upgrade\"'"

      - id: oxicloud
        title: OXICloud
        glyph: cloud
        kind: status
        description: Cloud storage
        link: https://oxicloud.home.lan/
        run: "ssh -t proxmox 'pct enter 111'"
        source:
          type: command
          argv: ["curl", "-k", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://oxicloud.home.lan/"]
        updates:
          interval_sec: 3600
          source:
            type: command
            argv: ["ssh", "proxmox", "pct exec 111 -- sh -c 'apt-get update -qq >/dev/null || exit 1; apt-get -s -q upgrade | grep -c ^Inst || true'"]
          run: "ssh -t proxmox 'pct exec 111 -- sh -c \"apt-get update && apt-get -y upgrade\"'"

      # Home Assistant is a VM (`haos`), not an LXC: no `pct enter` and no
      # container package list, so it is probe and link only.
      - id: home-assistant
        title: Home Assistant
        glyph: home-cog
        kind: status
        description: Smart home
        link: https://ha.home.lan/
        source:
          type: command
          argv: ["curl", "-k", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://ha.home.lan/"]

      - id: gotify
        title: Gotify
        glyph: bell
        kind: status
        description: Notification service
        link: https://gotify.home.lan/
        run: "ssh -t proxmox 'pct enter 105'"
        source:
          type: command
          argv: ["curl", "-k", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://gotify.home.lan/"]
        updates:
          interval_sec: 3600
          source:
            type: command
            argv: ["ssh", "proxmox", "pct exec 105 -- sh -c 'apt-get update -qq >/dev/null || exit 1; apt-get -s -q upgrade | grep -c ^Inst || true'"]
          run: "ssh -t proxmox 'pct exec 105 -- sh -c \"apt-get update && apt-get -y upgrade\"'"

      # Forgejo is Alpine, so its update check is apk's, written out (D17, D28).
      - id: forgejo
        title: Forgejo
        glyph: git-fork
        kind: status
        description: Git repositories
        link: https://forgejo.home.lan/
        run: "ssh -t proxmox 'pct enter 116'"
        source:
          type: command
          argv: ["curl", "-k", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://forgejo.home.lan/"]
        updates:
          interval_sec: 3600
          source:
            type: command
            argv: ["ssh", "proxmox", "pct exec 116 -- sh -c 'apk update -q >/dev/null 2>&1 || exit 1; apk version -l \"<\" | grep -c \"<\" || true'"]
          run: "ssh -t proxmox 'pct exec 116 -- sh -c \"apk update && apk upgrade\"'"

      - id: opencode
        title: Opencode
        glyph: code
        kind: status
        description: AI coding assistant
        link: https://opencode.home.lan/
        run: "ssh -t proxmox 'pct enter 117'"
        source:
          type: command
          argv: ["curl", "-k", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://opencode.home.lan/"]
        updates:
          interval_sec: 3600
          source:
            type: command
            argv: ["ssh", "proxmox", "pct exec 117 -- sh -c 'apt-get update -qq >/dev/null || exit 1; apt-get -s -q upgrade | grep -c ^Inst || true'"]
          run: "ssh -t proxmox 'pct exec 117 -- sh -c \"apt-get update && apt-get -y upgrade\"'"

      # Subagentix lives inside the opencode LXC (117), so its terminal enters
      # that container. It has no LXC of its own, so the update badge stays on
      # Opencode rather than being drawn twice for the same host.
      - id: subagentix
        title: Subagentix
        glyph: timeline
        kind: status
        description: Opencode session retrospectives (Gantt)
        link: https://subagentix.home.lan/
        run: "ssh -t proxmox 'pct enter 117'"
        source:
          type: command
          argv: ["curl", "-k", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://subagentix.home.lan/"]

      - id: bambuddy
        title: Bambuddy
        glyph: printer
        kind: status
        description: 3D printing control
        link: https://bambu.home.lan/
        run: "ssh -t proxmox 'pct enter 110'"
        source:
          type: command
          argv: ["curl", "-k", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://bambu.home.lan/"]
        updates:
          interval_sec: 3600
          source:
            type: command
            argv: ["ssh", "proxmox", "pct exec 110 -- sh -c 'apt-get update -qq >/dev/null || exit 1; apt-get -s -q upgrade | grep -c ^Inst || true'"]
          run: "ssh -t proxmox 'pct exec 110 -- sh -c \"apt-get update && apt-get -y upgrade\"'"

      - id: homelable
        title: Homelable
        glyph: devices
        kind: status
        description: Equipment inventory
        link: https://homelable.home.lan/
        run: "ssh -t proxmox 'pct enter 113'"
        source:
          type: command
          argv: ["curl", "-k", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://homelable.home.lan/"]
        updates:
          interval_sec: 3600
          source:
            type: command
            argv: ["ssh", "proxmox", "pct exec 113 -- sh -c 'apt-get update -qq >/dev/null || exit 1; apt-get -s -q upgrade | grep -c ^Inst || true'"]
          run: "ssh -t proxmox 'pct exec 113 -- sh -c \"apt-get update && apt-get -y upgrade\"'"

      - id: pocketbase
        title: PocketBase
        glyph: database
        kind: status
        description: Backend and database
        link: https://pocketbase.home.lan/_/
        run: "ssh -t proxmox 'pct enter 104'"
        source:
          type: command
          argv: ["curl", "-k", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://pocketbase.home.lan/_/"]
        updates:
          interval_sec: 3600
          source:
            type: command
            argv: ["ssh", "proxmox", "pct exec 104 -- sh -c 'apt-get update -qq >/dev/null || exit 1; apt-get -s -q upgrade | grep -c ^Inst || true'"]
          run: "ssh -t proxmox 'pct exec 104 -- sh -c \"apt-get update && apt-get -y upgrade\"'"

      - id: xyops
        title: XYOPS
        glyph: settings-automation
        kind: status
        description: Automation and plugins
        link: https://xyops.home.lan/
        run: "ssh -t proxmox 'pct enter 109'"
        source:
          type: command
          argv: ["curl", "-k", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://xyops.home.lan/"]
        updates:
          interval_sec: 3600
          source:
            type: command
            argv: ["ssh", "proxmox", "pct exec 109 -- sh -c 'apt-get update -qq >/dev/null || exit 1; apt-get -s -q upgrade | grep -c ^Inst || true'"]
          run: "ssh -t proxmox 'pct exec 109 -- sh -c \"apt-get update && apt-get -y upgrade\"'"

      - id: chronix
        title: Chronix
        glyph: history
        kind: status
        description: Log store and event viewer
        link: https://chronix.home.lan/
        run: "ssh -t proxmox 'pct enter 108'"
        source:
          type: command
          argv: ["curl", "-k", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://chronix.home.lan/"]
        updates:
          interval_sec: 3600
          source:
            type: command
            argv: ["ssh", "proxmox", "pct exec 108 -- sh -c 'apt-get update -qq >/dev/null || exit 1; apt-get -s -q upgrade | grep -c ^Inst || true'"]
          run: "ssh -t proxmox 'pct exec 108 -- sh -c \"apt-get update && apt-get -y upgrade\"'"


  # ── Releases ───────────────────────────────────────────────────────────────
  # The domain-level interval is the whole of release polling. A kind does not get
  # its own timer — a kind decides how a reading is drawn, not how often it is
  # fetched (D4).
  - id: releases
    title: Releases
    glyph: tag
    interval_sec: 3600

    cards:
      - id: shell
        title: Noctalia
        kind: release
        source: { type: static, value: "5.2.1" }

      - id: terminal
        title: Kitty
        kind: release
        source: { type: static, value: "0.36" }


  # ── Links ──────────────────────────────────────────────────────────────────
  # A `kind: link` card is a bookmark, not an instrument: no source, no state
  # dot, no buttons. The whole row is the target — a click opens `link:` in the
  # browser — so it is the one kind that omits `source`. The glyph is the picture
  # on the left and `description`, when set, is pushed to the right edge; the row
  # stays one line.
  - id: links
    title: Links
    glyph: link

    cards:
      - id: link-lxc-audit
        title: LXC Audit
        glyph: clipboard-list
        kind: link
        description: Proxmox audit wiki
        link: https://forgejo.home.lan/authelia/proxmox_audit/wiki

      - id: link-yt-mp3
        title: YouTube to MP3
        glyph: music
        kind: link
        description: Download the audio
        link: https://xyops.home.lan/api/app/form/v1/MpYWOFIdbO3nkCaS8Fmhj2l8QYSS3i42hgOOMzsLMSRBe4NGPOmxnAzrHO2joPKU

      - id: link-yt-summary
        title: YouTube Video Summary
        glyph: file-text
        kind: link
        description: Summarise a video
        link: https://xyops.home.lan/api/app/form/v1/TSlQGv8T9WgvYuavUFKd0CVUs4o2m8IvqsjIvl0ZZNAXrT5SYg0i7Yz2sNdHEmnV

      - id: link-pve-scripts
        title: ProxmoxVE Community Scripts
        glyph: script
        kind: link
        description: Community helper scripts
        link: https://community-scripts.org/

      - id: link-youtube
        title: YouTube
        glyph: brand-youtube
        kind: link
        description: Video site
        link: https://youtube.com

      - id: link-water
        title: Manual water updater
        glyph: droplet
        kind: link
        description: Water meter readings
        link: https://xyops.home.lan/api/app/form/v1/yePQkKNWf0umHd0wvEV6aqDLms8pSAT4VT8fNT6RmHD8uYvGFSsZFpxj0opNvkC6

# Secrets are not needed here. When you move to config/hub.example.yaml, put them
# in hub.secrets.yaml (mode 0600) and reference them as "${name}" — quoted inside
# a flow mapping, or YAML reads the brace as a nested mapping. See docs/03-config.md.
