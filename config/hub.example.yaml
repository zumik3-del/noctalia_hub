# noctalia_hub — example config
#
# Copy to ~/.config/noctalia/hub/hub.yaml and edit by hand.
# The plugin reloads the file automatically when it changes.
#
# Secrets live in hub.secrets.yaml; only ${name} references go here.
#
# Field reference: docs/03-config.md

version: 1

layout:
  density: compact          # compact | standard | comfortable
  show_header: true
  clock: "%H:%M:%S"
  stale_badge: true
  # Card-block framework (see docs/07-decisions.md, D24). Every field is optional;
  # these are the defaults. Colour is never set here — only density and shape.
  font_scale: 100           # 80..130, % applied to every text size
  card_radius: 9            # 0..24 px, corner rounding of a card block
  card_spacing: 8           # 0..32 px, gap between cards in a zone
  card_border: subtle       # none | subtle | accent
  card_background: tinted   # transparent | tinted | solid
  hover_effect: background  # none | background | border

defaults:
  interval_sec: 60
  timeout_ms: 8000
  stale_after_sec: 300
  graph_points: 48


domains:
  # ── Infrastructure ────────────────────────────────────────────────────────
  - id: infra
    title: Infrastructure
    glyph: server
    interval_sec: 30

    cards:
      - id: dynacat
        title: Dynacat
        glyph: cat
        kind: status
        description: Dashboard, feeds and release watching
        link: https://dynacat.home.lan
        source:
          type: http
          url: https://dynacat.home.lan/health
          ok_when: "status == 200"

      - id: proxmox-nodes
        title: Proxmox
        glyph: hexagon
        kind: metric
        span: 2
        source:
          type: http
          url: https://pve.home.lan:8006/api2/json/cluster/resources
          auth: { token: "${proxmox_token}" }
          # /cluster/resources returns nodes AND guests. The label says nodes, so
          # count nodes — a bare `length` counts every VM and LXC too.
          extract: ".data | map(select(.type == \"node\")) | length"
        format: "{n} nodes"
        thresholds: { warn: 6, critical: 8 }
        graph: true
        mini_cards:
          - { label: CPU, value: 68 }
          - { label: RAM, value: 12.4 }

      - id: proxmox-mem
        title: Memory
        glyph: database
        kind: metric
        source:
          type: http
          url: https://pve.home.lan:8006/api2/json/cluster/resources
          auth: { token: "${proxmox_token}" }
          extract: ".data | map(select(.type == \"node\")) | map(.mem) | add // 0"
        format: "{n} MB"
        thresholds: { warn: 24000, critical: 30000 }
        graph: 96

      # An LXC's own status endpoint, not the node's. /nodes/pve/status reports
      # the node and has no `status` field to test, so `ok_when` would never match.
      # /nodes/pve/lxc/<vmid>/status/current returns {"status": "running"}.
      - id: pocketbase
        title: Pocketbase
        glyph: database
        kind: status
        source:
          type: http
          url: https://pve.home.lan:8006/api2/json/nodes/pve/lxc/104/status/current
          auth: { token: "${proxmox_token}" }
          ok_when: "status == 'running'"

      - id: jellyfin
        title: Jellyfin
        glyph: movie
        kind: status
        source:
          type: http
          url: https://pve.home.lan:8006/api2/json/nodes/pve/lxc/107/status/current
          auth: { token: "${proxmox_token}" }
          ok_when: "status == 'running'"

      - id: link-proxmox
        title: Proxmox
        glyph: external-link
        kind: link
        link: https://pve.home.lan:8006
        source: { type: static, value: "—" }

      # run: opens a terminal window — it does not embed one. The string is
      # passed to the shell verbatim and never interpolates source values.
      #
      # The host-level `updates` reading: one hop, no `pct`, the node's own
      # packages. The same block on a container card adds `pct exec` (see the
      # Pi-hole and Forgejo cards below); that is the whole of the difference.
      - id: pve-ssh
        title: pve.home.lan
        glyph: terminal
        kind: status
        run: "ssh root@pve.home.lan"
        source:
          type: command
          argv: ["ping", "-c", "1", "-W", "2", "pve.home.lan"]
        updates:
          interval_sec: 3600
          source:
            type: command
            argv: ["ssh", "pve.home.lan", "sh -c 'apt-get update -qq >/dev/null || exit 1; apt-get -s -q upgrade | grep -c ^Inst || true'"]
          run: "ssh -t pve.home.lan 'apt-get update && apt-get -y upgrade'"

      # kind: console is a read-only tail. No input, no PTY — see D13.
      - id: pve-journal
        title: pve journal
        glyph: file-text
        kind: console
        stale_after_sec: 3600
        source:
          type: stream
          cmd: "journalctl -u pveproxy -f -o cat -n 20"
          pick: last
          lines: 12

      # kind: list built from text, not JSON. df -P emits fixed columns, so
      # `split: whitespace` turns each line into indexed fields and `row_format`
      # reads them. Without `split` this would be an awk pipeline in a shell
      # string — the quoting the schema refuses everywhere else. See D23.
      - id: mounts
        title: mounts
        glyph: device-desktop
        kind: list
        max_items: 8
        format: "{n} mounts"
        row_format: "{5}  {4}"
        source:
          type: command
          cmd: "df -P -x tmpfs -x devtmpfs -x squashfs | tail -n +2"
          split: whitespace


  # ── Releases ──────────────────────────────────────────────────────────────
  - id: releases
    title: Releases
    glyph: tag
    interval_sec: 900

    cards:
      - id: opencode
        title: OpenCode
        kind: release
        source:
          type: rss
          url: https://github.com/zumik3-del/opencode/releases.atom
          pick: first
          tag: title
        link_template: "https://github.com/zumik3-del/opencode/releases/tag/{tag}"

      - id: noctalia
        title: Noctalia
        kind: release
        source:
          type: rss
          url: https://github.com/noctalia-dev/noctalia/releases.atom
          pick: first
          tag: title
        link_template: "https://github.com/noctalia-dev/noctalia/releases/tag/{tag}"

      - id: kitty
        title: Kitty
        kind: release
        source:
          type: rss
          url: https://github.com/kovidgoyal/kitty/releases.atom
          pick: first
          tag: title
        link_template: "https://github.com/kovidgoyal/kitty/releases/tag/{tag}"


  # ── Feeds ─────────────────────────────────────────────────────────────────
  # Many feeds, one card. Merged feeds are always sorted newest-first — there is
  # no `sort` field because there is no wrong answer to offer. The keys are the
  # labels and become `{feed}`; a version with no repository attached is not
  # information. See D19.
  #
  # One dead feed annotates the card ("6 of 7 feeds") rather than turning it red.
  - id: feeds
    title: Feeds
    glyph: rss
    interval_sec: 1800
    stale_after_sec: 7200

    cards:
      - id: infra-releases
        title: Infra
        glyph: package
        kind: list
        span: 2
        max_items: 6
        row_format: "{feed}  {title}"
        description: Newest release across the infrastructure stack
        source:
          type: rss
          feeds:
            pi-hole: https://github.com/pi-hole/pi-hole/releases.atom
            caddy: https://github.com/caddyserver/caddy/releases.atom
            forgejo: https://codeberg.org/forgejo/forgejo/releases.rss
            authelia: https://github.com/authelia/authelia/releases.atom
            duplicati: https://github.com/duplicati/duplicati/releases.atom
            pocketbase: https://github.com/pocketbase/pocketbase/releases.atom
            xyops: https://github.com/pixlcore/xyops/releases.atom

      # community-scripts publishes a plain RSS feed of new scripts. No
      # thumbnails, no rendering — which is exactly why this fits a panel and
      # does not fit an HTML dashboard.
      - id: proxmox-scripts
        title: New scripts
        glyph: file-plus
        kind: list
        max_items: 8
        row_format: "{title}"
        description: Community scripts for Proxmox, newest first
        source:
          type: rss
          url: https://community-scripts.org/api/rss/scripts
          pick: first


  # ── Repositories ──────────────────────────────────────────────────────────
  - id: git
    title: Watching
    glyph: git-branch
    stale_after_sec: 900

    cards:
      - id: opencode-ci
        title: opencode
        kind: status
        link: https://github.com/zumik3-del/opencode/actions
        source:
          type: command
          argv: ["gh", "run", "list", "--limit", "1",
                 "--json", "conclusion", "-q", ".[0].conclusion"]
        map:
          success: ok
          failure: down
          cancelled: warn

      - id: hub-prs
        title: hub PRs
        kind: metric
        source:
          type: command
          cmd: "gh pr list --repo zumik3-del/noctalia_hub --json number -q 'length'"
        thresholds: { warn: 3, critical: 10 }
        link: https://github.com/zumik3-del/noctalia_hub/pulls


  # ── Jobs ──────────────────────────────────────────────────────────────────
  # xyOps. A worked example of deep_link: the metric and the click target are
  # the same fact, so a stale link cannot disagree with the number.
  #
  # limit: 1 fetches a single row; the count comes from list.length in the
  # response metadata. Asking for every row to count them is how one card
  # transfers a page of job records every 30 seconds.
  - id: jobs
    title: Jobs
    glyph: clock-play
    interval_sec: 60
    stale_after_sec: 300

    cards:
      # `result=error` is xyOps' own vocabulary for what the API calls
      # `tags:_error`. That mapping is not derivable, so it stays here where it
      # can be seen and updated. `{query}` is optional — see docs/03-config.md.
      - id: xyops-failed
        title: failed today
        glyph: alert-circle
        kind: metric
        source:
          type: http
          method: GET
          url: https://ops.home.lan/api/app/search_jobs/v1
          headers: ["X-API-Key: ${xyops_key}"]
          query: "tags:_error date:>=today"
          limit: 1
          extract: ".list.length"
        format: "{n}"
        thresholds: { warn: 1, critical: 5 }
        deep_link: "https://ops.home.lan/#Search?result=error&date=today"

      - id: xyops-ok
        title: ok today
        glyph: check
        kind: metric
        source:
          type: http
          method: GET
          url: https://ops.home.lan/api/app/search_jobs/v1
          headers: ["X-API-Key: ${xyops_key}"]
          query: "tags:_success date:>=today"
          limit: 1
          extract: ".list.length"
        format: "{n}"
        thresholds: { warn: 5000 }
        graph: 48
        deep_link: "https://ops.home.lan/#Search?result=success&date=today"

      - id: xyops-backup
        title: nightly backup
        glyph: archive
        kind: status
        source:
          type: http
          method: GET
          url: https://ops.home.lan/api/app/search_jobs/v1
          headers: ["X-API-Key: ${xyops_key}"]
          query: "event:ev3nt_backup date:>=today"
          limit: 1
          select: ["id", "code", "description"]
          extract: ".rows[0].code // 1"
        map:
          0: ok
          1: down
          2: warn
          3: warn
          4: down
        deep_link: "https://ops.home.lan/#Events?sub=view&id=ev3nt_backup"


  # ── Network ───────────────────────────────────────────────────────────────
  # Pi-hole and Caddy, both in LXC containers on the Proxmox node.
  #
  # Reached with plain `command` + ssh + pct exec — there is no proxmox source
  # type. argv keeps the quoting honest: everything after the host is ONE argv
  # element, so ssh forwards it verbatim and only the remote shell parses it.
  # See D17.
  - id: network
    title: Network
    glyph: network
    interval_sec: 120
    stale_after_sec: 600

    cards:
      # --- Pi-hole ------------------------------------------------------------
      # Liveness first: an HTTPS request to the service, no login, so the dot
      # answers "is the host answering" without a token the REST API would need.
      # Any HTTP response counts — the redirect to Authelia is a live host, not a
      # failure. `-k` is for a self-signed certificate, which is not the question
      # either. A `kind: status` card draws only the dot, so there is no `format:`
      # here to write "online" into (D27).
      #
      # The two trailing buttons are the card's actions — one to the admin UI, one
      # into the container. Both may sit on one card because each button has its
      # own target (D26), and the hop is D17's ssh + pct exec, with `-t` so `pct
      # enter` gets a TTY.
      #
      # `updates` is the second reading: the container's pending OS packages, as a
      # badge before the dot that is also the button which installs them. Debian's
      # check is written out; the plugin does not guess apt from apk (D27). `sh -c`
      # (not `sh -lc`) keeps the container's MOTD out of the output, and `|| true`
      # keeps a zero count from reading as a failed command.
      - id: pihole
        title: Pi-hole
        glyph: shield-check
        kind: status
        description: DNS filtering and ad blocking
        link: https://dns.home.lan/admin/
        run: "ssh -t pve.home.lan 'pct enter 100'"
        source:
          type: command
          argv: ["curl", "-k", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "3", "https://dns.home.lan/admin/"]
        updates:
          interval_sec: 3600
          source:
            type: command
            argv: ["ssh", "pve.home.lan", "pct exec 100 -- sh -c 'apt-get update -qq >/dev/null || exit 1; apt-get -s -q upgrade | grep -c ^Inst || true'"]
          run: "ssh -t pve.home.lan 'pct exec 100 -- sh -c \"apt-get update && apt-get -y upgrade\"'"

      # COUNT(DISTINCT domain), not COUNT(*). The gravity table's uniqueness is
      # enforced on the (domain, adlist_id) PAIR, not on domain alone — a domain
      # that appears in three subscribed lists occupies three rows. Counting rows
      # therefore counts list overlap, not domains. Verified: a test fixture with
      # one domain in two lists reports 4 rows and 3 domains.
      - id: pihole-gravity
        title: gravity
        glyph: shield-check
        kind: metric
        source:
          type: command
          argv: ["ssh", "pve.home.lan",
                 "pct exec 100 -- sqlite3 /etc/pihole/pihole-FTL.db 'SELECT COUNT(DISTINCT domain) FROM gravity'"]
        format: "{n} domains"
        thresholds: { warn: 200000, critical: 400000 }
        graph: 96

      # Blocked today. Pi-hole's status codes are not "1 = blocked" — they are
      # a documented enum where 2 and 3 are ALLOWED and 9-11 are blocked
      # during CNAME inspection. Counting `status != 2` therefore counts
      # things that were let through. The correct test is the negative of the
      # allowed set.
      - id: pihole-blocked
        title: blocked 24h
        glyph: shield-x
        kind: metric
        source:
          type: command
          argv: ["ssh", "pve.home.lan",
                 "pct exec 100 -- sqlite3 /etc/pihole/pihole-FTL.db \"SELECT COUNT(*) FROM queries WHERE timestamp > strftime('%s','now','-1 day') AND status NOT IN (0,2,3,12,13,14,17)\""]
        format: "{n}"
        thresholds: { warn: 5000, critical: 20000 }
        graph: 96

      # kind: list. This is what the panel has no other way to show: not one
      # number but the names themselves.
      #
      # `parse: json` because sqlite3 emits JSON with -json. Declaring it keeps
      # the shape in the source instead of a jq pipeline in a shell string.
      - id: pihole-top
        title: top blocked
        glyph: list-numbers
        kind: list
        max_items: 8
        format: "{n} seen"
        source:
          type: command
          argv: ["ssh", "pve.home.lan",
                 "pct exec 100 -- sqlite3 -json /etc/pihole/pihole-FTL.db \"SELECT domain, COUNT(*) AS n FROM queries WHERE timestamp > strftime('%s','now','-1 day') AND status NOT IN (0,2,3,12,13,14,17) GROUP BY domain ORDER BY n DESC LIMIT 8\""]
          parse: json
          extract: ".[*]"

      # --- Caddy --------------------------------------------------------------
      # caddy adapt is the honest read: it is Caddy's own parser, so what the
      # card shows is the configuration Caddy would actually serve, not a
      # guess at what the Caddyfile text means.
      - id: caddy-routes
        title: caddy routes
        glyph: route
        kind: list
        max_items: 8
        format: "{n} sites"
        description: Hostnames caddy adapts from its Caddyfile
        source:
          type: command
          argv: ["ssh", "pve.home.lan",
                 "pct exec 121 -- caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile"]
          parse: json
          # `..` walks every level and `.host?` ignores the non-matching ones, so
          # this survives Caddy renaming srv0 and survives a change in nesting
          # depth. A hard path like `.apps.http.servers.srv0.routes` breaks the
          # day Caddy emits servers in a different order.
          #
          # The brackets around the recursion are load-bearing. jq's `//` binds
          # more loosely than `|`, so `[.. | .host? // empty | flatten]` parses as
          # `.. | (.host? // (empty | flatten))` and the flatten never runs —
          # it silently yields an empty list. Collecting first and flattening
          # after is the only form that works. Verified against adapted JSON with
          # servers renamed and with host wrapped in an extra object.
          extract: "[(.. | .host? // empty)] | flatten"

      - id: caddy-count
        title: proxied
        glyph: world
        kind: metric
        span: 2
        source:
          type: command
          argv: ["ssh", "pve.home.lan",
                 "pct exec 121 -- caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile"]
          parse: json
          extract: "[(.. | .host? // empty)] | flatten | length"
        format: "{n} hostnames"
        thresholds: { warn: 60, critical: 100 }

      # --- Forgejo (Alpine) ---------------------------------------------------
      # The same second reading on a different distribution. `apk version -l '<'`
      # lists packages whose installed version is below the available one — with a
      # header line — so the count greps for the `<` marker rather than counting
      # lines, which would be off by one. The upgrade is Alpine's own; it may ask
      # for a confirmation in the terminal, which is exactly why the action opens
      # one.
      - id: forgejo
        title: Forgejo
        glyph: git-fork
        kind: status
        description: Git hosting, on Alpine
        link: https://code.home.lan
        run: "ssh -t pve.home.lan 'pct enter 116'"
        source: { type: static, value: "running" }
        updates:
          interval_sec: 3600
          source:
            type: command
            argv: ["ssh", "pve.home.lan", "pct exec 116 -- sh -c 'apk update -q >/dev/null 2>&1 || exit 1; apk version -l \"<\" | grep -c \"<\" || true'"]
          run: "ssh -t pve.home.lan 'pct exec 116 -- sh -c \"apk update && apk upgrade\"'"


  # ── Shell ─────────────────────────────────────────────────────────────────
  # Other Noctalia surfaces, reached by `panel:`. Not a link and not a `run:` —
  # `run` opens a terminal window, and a window flashing open to print "ok" is a
  # regression, not delegation. See D20.
  #
  # There is no standalone calendar or weather panel: both are sections of the
  # control center, reached through the context argument.
  - id: shell
    title: Shell
    glyph: apps
    stale_after_sec: 900

    cards:
      - id: go-calendar
        title: Calendar
        glyph: calendar
        kind: link
        description: Upcoming events, from the control center
        source: { type: static, value: "—" }
        panel: "control-center calendar"

      - id: go-weather
        title: Weather
        glyph: cloud
        kind: link
        description: Current conditions, from the control center
        source: { type: static, value: "—" }
        panel: "control-center weather"

      - id: go-launcher
        title: Launcher
        glyph: search
        kind: link
        description: Application launcher
        source: { type: static, value: "—" }
        panel: "launcher"

      # A plugin's panel is addressed as author/plugin:panel. If that plugin is
      # not installed the id does not resolve — and the panel checks ids at load
      # time, so this card fails validation with the name it looked for rather
      # than waiting for a click.
      - id: go-hassio
        title: Home Assistant
        glyph: home
        kind: link
        description: Entity manager from the hassio plugin
        source: { type: static, value: "—" }
        panel: "pozzoo/hassio:entity_manager"

      # The panel registry IS discoverable — a bad id makes the shell list every
      # panel that exists — but it is deliberately not a card here. The list
      # arrives as one line of comma-separated text with a prefix, and `kind:
      # list` has no way to split a row into fields. Shipping it would mean
      # three undocumented transformations and a card that breaks silently when
      # the shell rewords its error. See docs/03-config.md and the resolved
      # questions in docs/07-decisions.md.


  # ── Links ─────────────────────────────────────────────────────────────────
  - id: links
    title: Links
    glyph: link

    cards:
      - id: link-grafana
        title: Grafana
        glyph: chart-line
        kind: link
        link: https://grafana.home.lan
        source: { type: static, value: "—" }

      - id: link-uptime
        title: Uptime
        glyph: activity
        kind: link
        link: https://uptime.home.lan
        source: { type: static, value: "—" }

      - id: link-ha
        title: Home Assistant
        glyph: home
        kind: link
        link: https://ha.home.lan
        source: { type: static, value: "—" }
