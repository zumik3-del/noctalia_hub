# noctalia_hub — example config
#
# Copy to ~/.config/noctalia/hub/hub.yaml and edit by hand.
# The plugin reloads the file automatically when it changes.
#
# Secrets live in hub.secrets.yaml; only ${name} references go here.
#
# Field reference: docs/03-config.md

version: 1

layout:
  density: compact          # compact | comfortable
  show_header: true
  clock: "%H:%M:%S"
  stale_badge: true

defaults:
  interval_sec: 60
  timeout_ms: 8000
  stale_after_sec: 300
  graph_points: 48


domains:
  # ── Infrastructure ────────────────────────────────────────────────────────
  - id: infra
    title: Infrastructure
    glyph: server
    refresh: 30

    cards:
      - id: dynacat
        title: Dynacat
        glyph: cat
        kind: status
        description: Dashboard, feeds and release watching
        link: https://dynacat.lan
        source:
          type: http
          url: https://dynacat.lan/health
          ok_when: "status == 200"

      - id: proxmox-nodes
        title: Proxmox
        glyph: hexagon
        kind: metric
        span: 2
        source:
          type: http
          url: https://pve.lan:8006/api2/json/cluster/resources
          auth: { token: "${proxmox_token}" }
          extract: ".data | length"
        format: "{n} nodes"
        thresholds: { warn: 6, critical: 8 }
        graph: true

      - id: proxmox-mem
        title: Memory
        glyph: database
        kind: metric
        source:
          type: http
          url: https://pve.lan:8006/api2/json/cluster/resources
          auth: { token: "${proxmox_token}" }
          extract: ".data | map(select(.type == \"node\")) | map(.mem) | add // 0"
        format: "{n} MB"
        thresholds: { warn: 24000, critical: 30000 }
        graph: 96

      - id: plex
        title: Plex
        glyph: brand-plex
        kind: status
        source:
          type: http
          url: https://pve.lan:8006/api2/json/nodes/pve/status
          auth: { token: "${proxmox_token}" }
          ok_when: "status == 'running'"

      - id: sonarr
        title: Sonarr
        glyph: download
        kind: status
        source:
          type: http
          url: https://pve.lan:8006/api2/json/nodes/pve/status
          auth: { token: "${proxmox_token}" }
          ok_when: "status == 'running'"

      - id: link-proxmox
        title: Proxmox
        glyph: external-link
        kind: link
        link: https://pve.lan:8006
        source: { type: static, value: "—" }

      # run: opens a terminal window — it does not embed one. The string is
      # passed to the shell verbatim and never interpolates source values.
      - id: pve-ssh
        title: pve.lan
        glyph: ssh
        kind: status
        run: "ssh root@pve.lan"
        source:
          type: command
          argv: ["ping", "-c", "1", "-W", "2", "pve.lan"]

      # kind: console is a read-only tail. No input, no PTY — see D13.
      - id: pve-journal
        title: pve journal
        glyph: file-text
        kind: console
        stale_after_sec: 3600
        source:
          type: stream
          cmd: "journalctl -u pveproxy -f -o cat -n 20"
          pick: last
          lines: 12


  # ── Releases ──────────────────────────────────────────────────────────────
  - id: releases
    title: Releases
    glyph: tag
    interval_sec: 900

    cards:
      - id: opencode
        title: OpenCode
        kind: release
        source:
          type: rss
          url: https://github.com/zumik3-del/opencode/releases.atom
          pick: first
          tag: title
        link_template: "https://github.com/zumik3-del/opencode/releases/tag/{tag}"

      - id: noctalia
        title: Noctalia
        kind: release
        source:
          type: rss
          url: https://github.com/noctalia-dev/noctalia/releases.atom
          pick: first
          tag: title
        link_template: "https://github.com/noctalia-dev/noctalia/releases/tag/{tag}"

      - id: kitty
        title: Kitty
        kind: release
        source:
          type: rss
          url: https://github.com/kovidgoyal/kitty/releases.atom
          pick: first
          tag: title
        link_template: "https://github.com/kovidgoyal/kitty/releases/tag/{tag}"


  # ── Feeds ─────────────────────────────────────────────────────────────────
  # Many feeds, one card. Merged feeds are always sorted newest-first — there is
  # no `sort` field because there is no wrong answer to offer. The keys are the
  # labels and become `{feed}`; a version with no repository attached is not
  # information. See D19.
  #
  # One dead feed annotates the card ("6 of 7 feeds") rather than turning it red.
  - id: feeds
    title: Feeds
    glyph: rss
    interval_sec: 1800
    stale_after_sec: 7200

    cards:
      - id: infra-releases
        title: Infra
        glyph: package
        kind: list
        span: 2
        max_items: 6
        row_format: "{feed}  {title}"
        description: Newest release across the infrastructure stack
        source:
          type: rss
          feeds:
            pi-hole: https://github.com/pi-hole/pi-hole/releases.atom
            caddy: https://github.com/caddyserver/caddy/releases.atom
            forgejo: https://codeberg.org/forgejo/forgejo/releases.rss
            authelia: https://github.com/authelia/authelia/releases.atom
            duplicati: https://github.com/duplicati/duplicati/releases.atom
            pocketbase: https://github.com/pocketbase/pocketbase/releases.atom
            xyops: https://github.com/pixlcore/xyops/releases.atom

      # community-scripts publishes a plain RSS feed of new scripts. No
      # thumbnails, no rendering — which is exactly why this fits a panel and
      # does not fit an HTML dashboard.
      - id: proxmox-scripts
        title: New scripts
        glyph: file-plus
        kind: list
        max_items: 8
        row_format: "{title}"
        description: Community scripts for Proxmox, newest first
        source:
          type: rss
          url: https://community-scripts.org/api/rss/scripts
          pick: first


  # ── Repositories ──────────────────────────────────────────────────────────
  - id: git
    title: Watching
    glyph: git-branch
    stale_after_sec: 900

    cards:
      - id: opencode-ci
        title: opencode
        kind: status
        link: https://github.com/zumik3-del/opencode/actions
        source:
          type: command
          argv: ["gh", "run", "list", "--limit", "1",
                 "--json", "conclusion", "-q", ".[0].conclusion"]
        map:
          success: ok
          failure: down
          cancelled: warn

      - id: hub-prs
        title: hub PRs
        kind: metric
        source:
          type: command
          cmd: "gh pr list --repo zumik3-del/noctalia_hub --json number -q 'length'"
        thresholds: { warn: 3, critical: 10 }
        link: https://github.com/zumik3-del/noctalia_hub/pulls

      - id: disk-home
        title: Disk /
        glyph: hard-drive
        kind: metric
        source:
          type: command
          cmd: "df -P /home | tail -1 | awk '{print 100 - $5}'"
        format: "{n}%"
        thresholds: { warn: 85, critical: 93 }
        graph: 48


  # ── Jobs ──────────────────────────────────────────────────────────────────
  # xyOps. A worked example of deep_link: the metric and the click target are
  # the same fact, so a stale link cannot disagree with the number.
  #
  # limit: 1 fetches a single row; the count comes from list.length in the
  # response metadata. Asking for every row to count them is how one card
  # transfers a page of job records every 30 seconds.
  - id: jobs
    title: Jobs
    glyph: clock-play
    interval_sec: 60
    stale_after_sec: 300

    cards:
      - id: xyops-failed
        title: failed today
        glyph: alert-circle
        kind: metric
        source:
          type: http
          method: GET
          url: https://ops.lan/api/app/search_jobs/v1
          headers: ["X-API-Key: ${xyops_key}"]
          query: "tags:_error date:>=today"
          limit: 1
          extract: ".list.length"
        format: "{n}"
        thresholds: { warn: 1, critical: 5 }
        deep_link: "https://ops.lan/#Search?result=error&date=today"

      - id: xyops-ok
        title: ok today
        glyph: check
        kind: metric
        source:
          type: http
          method: GET
          url: https://ops.lan/api/app/search_jobs/v1
          headers: ["X-API-Key: ${xyops_key}"]
          query: "tags:_success date:>=today"
          limit: 1
          extract: ".list.length"
        format: "{n}"
        thresholds: { warn: 5000 }
        graph: 48
        deep_link: "https://ops.lan/#Search?result=success&date=today"

      - id: xyops-backup
        title: nightly backup
        glyph: database-backup
        kind: status
        source:
          type: http
          method: GET
          url: https://ops.lan/api/app/search_jobs/v1
          headers: ["X-API-Key: ${xyops_key}"]
          query: "event:ev3nt_backup date:>=today"
          limit: 1
          select: ["id", "code", "description"]
          extract: ".rows[0].code // 1"
        map:
          0: ok
          1: down
          2: warn
          3: warn
          4: down
        deep_link: "https://ops.lan/#Events?sub=view&id=ev3nt_backup"


  # ── Network ───────────────────────────────────────────────────────────────
  # Pi-hole and Caddy, both in LXC containers on the Proxmox node.
  #
  # Reached with plain `command` + ssh + pct exec — there is no proxmox source
  # type. argv keeps the quoting honest: everything after the host is ONE argv
  # element, so ssh forwards it verbatim and only the remote shell parses it.
  # See D17.
  - id: network
    title: Network
    glyph: network
    interval_sec: 120
    stale_after_sec: 600

    cards:
      # --- Pi-hole ------------------------------------------------------------
      # COUNT(DISTINCT domain), not COUNT(*). The gravity table's uniqueness is
      # enforced on the (domain, adlist_id) PAIR, not on domain alone — a domain
      # that appears in three subscribed lists occupies three rows. Counting rows
      # therefore counts list overlap, not domains. Verified: a test fixture with
      # one domain in two lists reports 4 rows and 3 domains.
      - id: pihole-gravity
        title: gravity
        glyph: shield-check
        kind: metric
        source:
          type: command
          argv: ["ssh", "pve.lan",
                 "pct exec 101 -- sqlite3 /etc/pihole/pihole-FTL.db 'SELECT COUNT(DISTINCT domain) FROM gravity'"]
        format: "{n} domains"
        thresholds: { warn: 200000, critical: 400000 }
        graph: 96

      # Blocked today. Pi-hole's status codes are not "1 = blocked" — they are
      # a documented enum where 2 and 3 are ALLOWED and 9-11 are blocked
      # during CNAME inspection. Counting `status != 2` therefore counts
      # things that were let through. The correct test is the negative of the
      # allowed set.
      - id: pihole-blocked
        title: blocked 24h
        glyph: shield-x
        kind: metric
        source:
          type: command
          argv: ["ssh", "pve.lan",
                 "pct exec 101 -- sqlite3 /etc/pihole/pihole-FTL.db \"SELECT COUNT(*) FROM queries WHERE timestamp > strftime('%s','now','-1 day') AND status NOT IN (0,2,3,12,13,14,17)\""]
        format: "{n}"
        thresholds: { warn: 5000, critical: 20000 }
        graph: 96

      # kind: list. This is what the panel has no other way to show: not one
      # number but the names themselves.
      #
      # `parse: json` because sqlite3 emits JSON with -json. Declaring it keeps
      # the shape in the source instead of a jq pipeline in a shell string.
      - id: pihole-top
        title: top blocked
        glyph: list-numbers
        kind: list
        max_items: 8
        format: "{n} seen"
        source:
          type: command
          argv: ["ssh", "pve.lan",
                 "pct exec 101 -- sqlite3 -json /etc/pihole/pihole-FTL.db \"SELECT domain, COUNT(*) AS n FROM queries WHERE timestamp > strftime('%s','now','-1 day') AND status NOT IN (0,2,3,12,13,14,17) GROUP BY domain ORDER BY n DESC LIMIT 8\""]
          parse: json
          extract: ".[*]"

      # --- Caddy --------------------------------------------------------------
      # caddy adapt is the honest read: it is Caddy's own parser, so what the
      # card shows is the configuration Caddy would actually serve, not a
      # guess at what the Caddyfile text means.
      - id: caddy-routes
        title: caddy routes
        glyph: route
        kind: list
        max_items: 8
        format: "{n} sites"
        description: Hostnames caddy adapts from its Caddyfile
        source:
          type: command
          argv: ["ssh", "pve.lan",
                 "pct exec 102 -- caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile"]
          parse: json
          # `..` walks every level and `.host?` ignores the non-matching ones, so
          # this survives Caddy renaming srv0 and survives a change in nesting
          # depth. A hard path like `.apps.http.servers.srv0.routes` breaks the
          # day Caddy emits servers in a different order.
          #
          # The brackets around the recursion are load-bearing. jq's `//` binds
          # more loosely than `|`, so `[.. | .host? // empty | flatten]` parses as
          # `.. | (.host? // (empty | flatten))` and the flatten never runs —
          # it silently yields an empty list. Collecting first and flattening
          # after is the only form that works. Verified against adapted JSON with
          # servers renamed and with host wrapped in an extra object.
          extract: "[(.. | .host? // empty)] | flatten"

      - id: caddy-count
        title: proxied
        glyph: world
        kind: metric
        span: 2
        source:
          type: command
          argv: ["ssh", "pve.lan",
                 "pct exec 102 -- caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile"]
          parse: json
          extract: "[(.. | .host? // empty)] | flatten | length"
        format: "{n} hostnames"
        thresholds: { warn: 60, critical: 100 }


  # ── Shell ─────────────────────────────────────────────────────────────────
  # Other Noctalia surfaces, reached by `panel:`. Not a link and not a `run:` —
  # `run` opens a terminal window, and a window flashing open to print "ok" is a
  # regression, not delegation. See D20.
  #
  # There is no standalone calendar or weather panel: both are sections of the
  # control center, reached through the context argument.
  - id: shell
    title: Shell
    glyph: apps
    stale_after_sec: 900

    cards:
      - id: go-calendar
        title: Calendar
        glyph: calendar
        kind: link
        description: Upcoming events, from the control center
        source: { type: static, value: "—" }
        panel: "control-center calendar"

      - id: go-weather
        title: Weather
        glyph: cloud
        kind: link
        description: Current conditions, from the control center
        source: { type: static, value: "—" }
        panel: "control-center weather"

      - id: go-launcher
        title: Launcher
        glyph: search
        kind: link
        description: Application launcher
        source: { type: static, value: "—" }
        panel: "launcher"

      # A plugin's panel is addressed as author/plugin:panel. If that plugin is
      # not installed the id does not resolve — and the panel checks ids at load
      # time, so this card fails validation with the name it looked for rather
      # than waiting for a click.
      - id: go-hassio
        title: Home Assistant
        glyph: home-assistant
        kind: link
        description: Entity manager from the hassio plugin
        source: { type: static, value: "—" }
        panel: "pozzoo/hassio:entity_manager"

      # The panel registry IS discoverable — a bad id makes the shell list every
      # panel that exists — but it is deliberately not a card here. The list
      # arrives as one line of comma-separated text with a prefix, and `kind:
      # list` has no way to split a row into fields. Shipping it would mean
      # three undocumented transformations and a card that breaks silently when
      # the shell rewords its error. See docs/03-config.md and the open questions.


  # ── Links ─────────────────────────────────────────────────────────────────
  - id: links
    title: Links
    glyph: link

    cards:
      - id: link-grafana
        title: Grafana
        glyph: chart-line
        kind: link
        link: https://grafana.home.lan
        source: { type: static, value: "—" }

      - id: link-uptime
        title: Uptime
        glyph: activity
        kind: link
        link: https://uptime.home.lan
        source: { type: static, value: "—" }

      - id: link-ha
        title: Home Assistant
        glyph: home-assistant
        kind: link
        link: https://ha.home.lan
        source: { type: static, value: "—" }