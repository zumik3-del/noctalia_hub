# Noctalia plugin source index.
#
# Noctalia reads this file to decide what a source ships; it is what
# `noctalia msg plugins list`, `enable` and `disable` resolve against. The
# upstream catalogs are generated by CI and say so in their header — this one is
# hand-written, because there is no CI yet, and a generated-file banner here
# would be a lie.
#
# One [[plugin]] row per plugin directory. The row is the index entry only:
# plugin.toml stays authoritative and is re-read on enable, so a version bump
# means editing both files. See docs/05-architecture.md.
#
# The directory is named `plugin/`, while the id's second segment is `hub`.
# Noctalia finds plugin.toml by scanning the source, so loading works; the
# community catalog's own validator does insist the directory match, which is
# why publishing will mean renaming `plugin/` to `hub/`. See docs/07-decisions.md.

[[plugin]]
id = "zumik3-del/hub"
name = "Hub"
version = "0.1.0"
plugin_api = 32
author = "zumik3-del"
license = "MIT"
icon = "gauge"
description = "Full-screen instrument panel: service status, metrics, releases and links from one YAML file."
tags = ["bar", "panel", "service", "indicator", "utility", "system"]
updated_at = 1791435025
added_at = 1791435025
